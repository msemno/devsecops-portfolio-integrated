apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devsecops-demo-isolation
  namespace: devsecops-demo
spec:
  podSelector:
    matchLabels: {app: devsecops-demo}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {role: approved-client}
      ports:
        - {protocol: TCP, port: 8080}
  egress: []
